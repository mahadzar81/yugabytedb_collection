---
# Sample inventory for a 3-node YugabyteDB cluster
# Adjust hostnames / IPs and connection parameters for your environment.

all:
  vars:
    ansible_user: ansible
    ansible_ssh_private_key_file: ~/.ssh/id_rsa
    ansible_python_interpreter: /usr/bin/python3

    # ── YugabyteDB settings ────────────────────────────────────────────────
    yugabyte_version: "2.20.3.0"
    yugabyte_build: "b68"
    yugabyte_replication_factor: 3

    yugabyte_install_dir: /opt/yugabyte
    yugabyte_data_dir: /mnt/data/yugabyte
    yugabyte_log_dir: /var/log/yugabyte

    # ── Tuning ────────────────────────────────────────────────────────────
    yugabyte_configure_ntp: true
    yugabyte_configure_kernel: true
    yugabyte_manage_firewall: true

    # ── Features ──────────────────────────────────────────────────────────
    yugabyte_enable_ysql: true
    yugabyte_enable_ycql: true
    yugabyte_enable_yedis: false

    # ── TLS (optional) ────────────────────────────────────────────────────
    yugabyte_enable_tls: false
    # yugabyte_ca_cert: files/certs/ca.crt
    # yugabyte_node_cert: files/certs/node.crt
    # yugabyte_node_key: files/certs/node.key

yugabyte_masters:
  hosts:
    yb-node-1:
      ansible_host: 10.0.1.10
    yb-node-2:
      ansible_host: 10.0.1.11
    yb-node-3:
      ansible_host: 10.0.1.12

yugabyte_tservers:
  hosts:
    yb-node-1:
      ansible_host: 10.0.1.10
    yb-node-2:
      ansible_host: 10.0.1.11
    yb-node-3:
      ansible_host: 10.0.1.12

# Convenience group – all YugabyteDB nodes
yugabyte_nodes:
  children:
    yugabyte_masters: {}
    yugabyte_tservers: {}
