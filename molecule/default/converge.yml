---
- name: Bootstrap Python on RHEL 8
  hosts: yugabyte_nodes
  become: false
  gather_facts: false

  tasks:
    - name: Install python39 on Rocky/RHEL 8
      ansible.builtin.raw: |
        if grep -qi "release 8" /etc/redhat-release 2>/dev/null; then
          dnf install -y python39 && \
          alternatives --set python3 /usr/bin/python3.9
        fi
      changed_when: false

- name: Converge – preflight and install (no live binaries in unit tests)
  hosts: all
  #become: true
  gather_facts: true

  pre_tasks:
    - name: Update apt cache (Debian/Ubuntu)
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_os_family == 'Debian'
      changed_when: false

  roles:
    - role: mahadzar81.yugabytedb_collection.yugabyte_preflight
