---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml

driver:
  name: docker

platforms:
  - name: yb-rhel8
    image: geerlingguy/docker-rockylinux8-ansible:latest
    pre_build_image: true
    privileged: true
    command: /usr/sbin/init
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    user: root
    # Rocky/RHEL 8 ships Python 3.6 by default; ansible-core needs >= 3.8
    env:
      ANSIBLE_PYTHON_INTERPRETER: /usr/bin/python3.8
    groups:
      - yugabyte_masters
      - yugabyte_tservers
      - yugabyte_nodes

  - name: yb-ubuntu2204
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    pre_build_image: true
    privileged: true
    command: /lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    user: root
    groups:
      - yugabyte_masters
      - yugabyte_tservers
      - yugabyte_nodes

provisioner:
  name: ansible
  connection_options:
    ansible_connection: docker
    ansible_user: root
  inventory:
    group_vars:
      all:
        yugabyte_version: "2.20.3.0"
        yugabyte_build: "b68"
        yugabyte_replication_factor: 1
        yugabyte_configure_ntp: false
        yugabyte_manage_firewall: false
        yugabyte_configure_kernel: false
        yugabyte_min_ram_mb: 256
        yugabyte_min_cpu_cores: 1
        yugabyte_min_disk_gb: 2
        yugabyte_run_ysql_healthcheck: false
    host_vars:
      # RHEL/Rocky 8 ships Python 3.6; force 3.8 which is available via AppStream
      yb-rhel8:
        ansible_python_interpreter: /usr/bin/python3.8

lint: |
  set -e
  yamllint .
  ansible-lint

verifier:
  name: ansible