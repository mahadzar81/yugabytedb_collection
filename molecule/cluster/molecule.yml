---
# Full cluster scenario: 3 masters + 3 tservers in Docker
# Uses mock/stub approach – replaces yb-master/tserver with shell stubs
# so the service lifecycle and port-wait tasks can be exercised without
# downloading 2 GB of actual YugabyteDB binaries.

dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml

driver:
  name: docker

platforms:
  - name: yb-master-1
    image: geerlingguy/docker-rockylinux9-ansible:latest
    pre_build_image: true
    privileged: true
    command: /usr/sbin/init
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    groups:
      - yugabyte_masters
      - yugabyte_nodes

  - name: yb-master-2
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    pre_build_image: true
    privileged: true
    command: /lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    groups:
      - yugabyte_masters
      - yugabyte_nodes

  - name: yb-master-3
    image: geerlingguy/docker-debian12-ansible:latest
    pre_build_image: true
    privileged: true
    command: /lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    groups:
      - yugabyte_masters
      - yugabyte_nodes

  - name: yb-tserver-1
    image: geerlingguy/docker-rockylinux9-ansible:latest
    pre_build_image: true
    privileged: true
    command: /usr/sbin/init
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    groups:
      - yugabyte_tservers
      - yugabyte_nodes

  - name: yb-tserver-2
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    pre_build_image: true
    privileged: true
    command: /lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    groups:
      - yugabyte_tservers
      - yugabyte_nodes

  - name: yb-tserver-3
    image: geerlingguy/docker-debian12-ansible:latest
    pre_build_image: true
    privileged: true
    command: /lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    groups:
      - yugabyte_tservers
      - yugabyte_nodes

provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
  inventory:
    group_vars:
      all:
        yugabyte_version: "2.20.3.0"
        yugabyte_build: "b68"
        yugabyte_replication_factor: 3
        yugabyte_configure_ntp: false
        yugabyte_manage_firewall: false
        yugabyte_configure_kernel: false
        yugabyte_min_ram_mb: 256
        yugabyte_min_cpu_cores: 1
        yugabyte_min_disk_gb: 2
        yugabyte_install_dir: /opt/yugabyte
        yugabyte_data_dir: /mnt/data/yugabyte
        yugabyte_log_dir: /var/log/yugabyte
        # Skip actual binary download in CI – use stubs
        yugabyte_use_stubs: true

lint: |
  set -e
  yamllint .
  ansible-lint

verifier:
  name: ansible
