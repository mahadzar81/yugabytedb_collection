---
- name: Bootstrap Python on RHEL 8
  hosts: yugabyte_nodes
  become: false
  gather_facts: false

  tasks:
    - name: Install python38 on Rocky/RHEL 8
      ansible.builtin.raw: |
        if grep -qi "release 8" /etc/redhat-release 2>/dev/null; then
          dnf install -y python38 && \
          alternatives --set python3 /usr/bin/python3.8
        fi
      changed_when: false

- name: Converge – configure roles (stub binaries pre-installed by prepare.yml)
  hosts: yugabyte_nodes
  become: false   # already root
  gather_facts: true

  pre_tasks:
    - name: Update apt cache (Debian/Ubuntu)
      ansible.builtin.apt:
        update_cache: true
      when: ansible_os_family == 'Debian'
      changed_when: false

  roles:
    - role: yugabyte.db.yugabyte_preflight
    - role: yugabyte.db.yugabyte_configure