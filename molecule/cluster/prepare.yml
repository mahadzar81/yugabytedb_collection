---
# Bootstrap Python 3.8 on RHEL/Rocky 8 before any module runs.
- name: Bootstrap Python on RHEL 8
  hosts: yugabyte_nodes
  become: false
  gather_facts: false

  tasks:
    - name: Install python38 on Rocky/RHEL 8
      ansible.builtin.raw: |
        if grep -qi "release 8" /etc/redhat-release 2>/dev/null; then
          dnf install -y python38 && \
          alternatives --set python3 /usr/bin/python3.8
        fi
      changed_when: false

- name: Prepare – install YugabyteDB stub binaries
  hosts: yugabyte_nodes
  become: false   # already root
  gather_facts: true

  tasks:
    - name: Update apt cache (Debian/Ubuntu)
      ansible.builtin.apt:
        update_cache: true
      when: ansible_os_family == 'Debian'
      changed_when: false

    - name: Create stub directory tree
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - /opt/yugabyte/yugabyte-2.20.3.0/bin
        - /mnt/data/yugabyte/master
        - /mnt/data/yugabyte/tserver
        - /var/log/yugabyte/master
        - /var/log/yugabyte/tserver
        - /etc/yugabyte

    - name: Create yugabyte group
      ansible.builtin.group:
        name: yugabyte
        state: present

    - name: Create yugabyte user
      ansible.builtin.user:
        name: yugabyte
        group: yugabyte

    - name: Deploy stub yb-master binary
      ansible.builtin.copy:
        dest: /opt/yugabyte/yugabyte-2.20.3.0/bin/yb-master
        content: |
          #!/bin/bash
          while true; do sleep 60; done
        owner: yugabyte
        group: yugabyte
        mode: "0755"

    - name: Deploy stub yb-tserver binary
      ansible.builtin.copy:
        dest: /opt/yugabyte/yugabyte-2.20.3.0/bin/yb-tserver
        content: |
          #!/bin/bash
          while true; do sleep 60; done
        owner: yugabyte
        group: yugabyte
        mode: "0755"

    - name: Deploy stub yb-admin binary
      ansible.builtin.copy:
        dest: /opt/yugabyte/yugabyte-2.20.3.0/bin/yb-admin
        content: |
          #!/bin/bash
          case "$*" in
            *list_all_masters*)
              echo "Master UUID | RPC Host/Port | State | Role"
              echo "stub-uuid-1 | 127.0.0.1:7100 | ALIVE | LEADER"
              ;;
            *list_all_tablet_servers*)
              echo "Tablet Server UUID | RPC Host/Port | Status"
              echo "stub-ts-1 | 127.0.0.1:9100 | ALIVE"
              ;;
            *)
              echo "OK"
              ;;
          esac
          exit 0
        owner: yugabyte
        group: yugabyte
        mode: "0755"

    - name: Deploy stub post_install.sh
      ansible.builtin.copy:
        dest: /opt/yugabyte/yugabyte-2.20.3.0/bin/post_install.sh
        content: "#!/bin/bash\nexit 0\n"
        owner: yugabyte
        group: yugabyte
        mode: "0755"

    - name: Create 'current' symlink
      ansible.builtin.file:
        src: /opt/yugabyte/yugabyte-2.20.3.0
        dest: /opt/yugabyte/current
        state: link
        force: true

    - name: Install netcat (for port checks in CI)
      ansible.builtin.package:
        name: "{{ 'nmap-ncat' if ansible_os_family == 'RedHat' else 'netcat-openbsd' }}"
        state: present